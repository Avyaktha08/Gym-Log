<head>
  <html>
    <title>GYM Log</title>

    <p class="title">GYM LOG</p>

      <select class="inputElement">
        <option value="" selected disabled>Enter Exercise</option>
        <optgroup label="Bicep">
          <option>Bayesian Cable Curl</option>
          <option>Cable Curl</option>
          <option>Barbell Curl</option>
          <option>EZ-Bar Curl</option>
          <option>Standing Dumbbell Curl</option>
          <option>Hammer Curl</option>
          <option>Preacher Curl</option>
          <option>Chin Ups</option>          
        </optgroup>

        <optgroup label="Tricep">
          <option>Cable Tricep Pushdown</option>
          <option>Overhead Cable Extension</option>
          <option>Parallel-Bar Dips</option>
          <option>Single Arm Pushdown</option>
          <option>Dumbbell Overhead Extension</option>
          <option>EZ-Bar Skull Crushers</option>
        </optgroup>

        <optgroup label="Chest">
          <option>Multi Press Chest Machine</option>
          <option>Low-to-High Cable Crossover</option>
          <option>High-to-Low Cable Crossover</option>
          <option>Pec Deck Machine</option>
          <option>Incline Dumbbell Press</option>
          <option>Flat Dumbbell Press</option>
          <option>Lateral Chest Wide Machine</option>
          <option>Push Ups</option>
        </optgroup>

        <optgroup label="Back">
          <option>Pull Ups</option>
          <option>Lat Pulldown</option>
          <option>Seated Cable Row</option>
          <option>Back Extension</option>
          <option>T-Bar rows</option>
          <option>Chest Supported Rows Machine</option>
        </optgroup>

        <optgroup label="Shoulder">
          <option>Multi Press Shoulder Machine</option>
          <option>Overhead Press Machine</option>
          <option>Dumbbell Lateral Raise</option>
          <option>Cable Lateral Raise</option>
          <option>Face Pull</option>
          <option>Overhead Barbell Press</option>
        </optgroup>

        <optgroup label="Legs">
          <option>Squat Machine</option>
          <option>Smith Machine Squat</option>
          <option>Dumbbell squats</option>
          <option>Quad Extension</option>
          <option>Hamstring Extension</option>
          <option>Seated Calf Raise</option>
          <option>Leg Press</option>
        </optgroup>
      </select>

    <input class="weightElement" placeholder="Enter Weight" type="number" min="0"/>

    <input class="repsElement" placeholder="No. of Reps" type="number" min="0"/>

    <input class="setsElement" placeholder="Total no. of sets" type="number" min="0"/>

    <input type="date" class="dateElement">

    <button class="addButton">ADD</button>

    <div class="goodJob"></div>

    <div class="display"></div>








    <script src="script.js"></script>



  </html>
</head>
